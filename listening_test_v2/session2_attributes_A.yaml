testname: FOA-to-binaural listening test, session 2 (attributes, order A)
testId: foa2bin_v3_session2_A
bufferSize: 2048
stopOnErrors: true
showButtonPreviousPage: true
remoteService: service/write.php
pages:
- type: generic
  id: intro
  name: Sesja 2 z 2 · Session 2 of 2
  content: '<p><b>PL</b> Potrzebne są słuchawki (najlepiej przewodowe, nauszne lub wokółuszne) i ciche miejsce. Ustaw w systemie
    częstotliwość próbkowania wyjścia audio na <b>48 kHz</b>; przy innej wartości webMUSHRA zatrzyma test z komunikatem o
    błędzie.</p><p>Na każdej stronie jest referencja oraz sześć wersji tego samego 10-sekundowego nagrania. Wśród nich jest
    ukryta kopia referencji i dwie wersje celowo zdegradowane. Odtwarzaj i przełączaj wersje dowolnie (pętla), a następnie
    oceń każdą w skali 0–100 względem referencji. Ukrytą referencję oceń na 100. Przesuń każdy suwak, także gdy zostawiasz
    wysoką ocenę.</p><p><b>EN</b> You need headphones (preferably wired, on-ear or over-ear) and a quiet place. Set your system
    audio output to <b>48 kHz</b>; with another sample rate webMUSHRA stops with an error.</p><p>Each page has a reference
    and six versions of the same 10-second recording. One of them is a hidden copy of the reference and two are deliberately
    degraded. Play and switch freely (loop), then rate each version from 0 to 100 against the reference. Rate the hidden reference
    100. Move every slider, even if you keep a high score.</p><p><small>Otwórz test linkiem, który dostałeś/aś (zawiera Twój
    kod uczestnika). · Open the test with the link you received (it contains your participant code).</small></p><p><b>PL</b>
    Sesja 2: 1 strona treningowa, potem 4 bloki po 6 stron (ok. 35 minut). W każdym bloku oceniasz <b>inną cechę</b>, więc
    każde nagranie usłyszysz kilka razy. Nazwa cechy jest w tytule strony, a jej opis nad suwakami. Oceniaj tylko tę cechę.</p><p><b>EN</b>
    Session 2: 1 training page, then 4 blocks of 6 pages (about 35 minutes). Each block rates a <b>different attribute</b>,
    so you will hear each recording several times. The attribute is in the page title and described above the sliders. Rate
    only that attribute.</p><ul><li><b>Barwa</b>: proporcja wysokich i niskich częstotliwości (jaśniej / ciemniej, więcej
    / mniej basu) w porównaniu z referencją. Oceniaj tylko barwę, nie kierunek ani artefakty.<br/><b>Tone colour</b>: the
    balance of high and low frequencies (brighter / darker, more / less bass) compared with the reference. Judge only tone
    colour, not direction or artefacts.</li><li><b>Lokalizacja i szerokość</b>: czy źródła dźwięku są w tych samych kierunkach
    i mają tę samą szerokość co w referencji.<br/><b>Localisation and width</b>: whether the sound sources appear in the same
    directions and with the same width as in the reference.</li><li><b>Artefakty</b>: dodane niepożądane dźwięki, których
    nie ma w referencji: zniekształcenia, szum, trzaski, brzmienie metaliczne lub „fazowe”. 100 = brak dodanych artefaktów.<br/><b>Artefacts</b>:
    added unwanted sounds that are not in the reference: distortion, noise, clicks, metallic or "phasey" sound. 100 = no added
    artefacts.</li><li><b>Eksternalizacja</b>: czy dźwięk jest odbierany na zewnątrz głowy tak jak w referencji, czy bardziej
    „w głowie”.<br/><b>Externalisation</b>: whether the sound is perceived outside the head as in the reference, or more inside
    the head.</li></ul>'
- type: volume
  id: vol
  name: Głośność · Volume
  content: Ustaw wygodną głośność i nie zmieniaj jej do końca sesji. · Set a comfortable level and do not change it until
    the end of the session.
  stimulus: configs/listening_test_v2/audio/1630ba93ced26798.wav
  defaultVolume: 0.5
- type: mushra
  id: training_1
  name: Trening · Training 1/1
  content: '<b>Strona treningowa, oceny nie są analizowane.</b> Posłuchaj referencji i wszystkich wersji, znajdź ukrytą referencję
    i wersje zdegradowane, poćwicz suwaki. · <b>Training page, ratings are not analysed.</b> Listen to the reference and all
    versions, find the hidden reference and the degraded versions, practise the sliders.<br/><br/><b>Barwa</b>: proporcja
    wysokich i niskich częstotliwości (jaśniej / ciemniej, więcej / mniej basu) w porównaniu z referencją. Oceniaj tylko barwę,
    nie kierunek ani artefakty.<br/><b>Tone colour</b>: the balance of high and low frequencies (brighter / darker, more /
    less bass) compared with the reference. Judge only tone colour, not direction or artefacts.'
  showWaveform: false
  enableLooping: true
  reference: configs/listening_test_v2/audio/0578cf27c5fd096f.wav
