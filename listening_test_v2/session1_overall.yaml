    i wersje zdegradowane, poćwicz suwaki. · <b>Training page, ratings are not analysed.</b> Listen to the reference and all
    versions, find the hidden reference and the degraded versions, practise the sliders.<br/><br/><b>Jakość ogólna</b>: na
    ile każda wersja brzmi jak referencja, biorąc pod uwagę wszystko: barwę, kierunki, eksternalizację i artefakty.<br/><b>Overall
    quality</b>: how close each version sounds to the reference, considering everything: tone colour, directions, externalisation
    and artefacts.'
