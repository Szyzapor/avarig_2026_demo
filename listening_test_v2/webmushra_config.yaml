testname: FOA-to-binaural listening test (AVARIG 2026 follow-up)
testId: foa2bin_avarig_followup
bufferSize: 2048
stopOnErrors: true
showButtonPreviousPage: true
remoteService: service/write.php
pages:
- type: generic
  id: intro
  name: Welcome
  content: Headphones required. Each page has a reference and several stimuli, including a hidden reference and anchors. Rate
    each stimulus against the reference (0–100). Loop and switch freely.
- type: volume
  id: vol
  name: Volume
  content: Set a comfortable listening level; do not change it during the test.
  stimulus: configs/listening_test_v2/audio/zhu__zhu_001/reference.wav
  defaultVolume: 0.5
