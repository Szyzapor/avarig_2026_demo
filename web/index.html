<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Binaural listening test</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="top">
  <span class="brand">🎧 <span data-i18n="title"></span></span>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="pl">PL</button>
  </div>
</header>
<div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>

<main>
  <!-- 1. intro + consent -->
  <section id="s-intro" class="screen">
    <h1 data-i18n="title"></h1>
    <p class="lead" data-i18n="intro_lead"></p>
    <p data-i18n="intro_time"></p>
    <h2 data-i18n="intro_req_h"></h2>
    <ul>
      <li data-i18n="intro_req_1"></li>
      <li data-i18n="intro_req_2"></li>
      <li data-i18n="intro_req_3"></li>
    </ul>
    <h2 data-i18n="intro_data_h"></h2>
    <p class="small" data-i18n="intro_data_1"></p>
    <p class="small" data-i18n="intro_data_2"></p>
    <p class="small" id="contact" hidden><span data-i18n="intro_contact"></span> <a id="contact-link"></a></p>
    <label class="consent"><input type="checkbox" id="consent" /> <span data-i18n="consent"></span></label>
    <div class="actions"><button class="primary" id="btn-start" disabled data-i18n="start"></button></div>
  </section>

  <!-- 2. questionnaire (fields generated by app.js) -->
  <section id="s-survey" class="screen" hidden>
    <h1 data-i18n="survey_h"></h1>
    <p class="lead" data-i18n="survey_lead"></p>
    <form id="survey-form" novalidate></form>
    <p class="error" id="survey-error" hidden data-i18n="fill_required"></p>
    <div class="actions"><button class="primary" id="btn-survey" data-i18n="continue"></button></div>
  </section>

  <!-- 3. headphone check -->
  <section id="s-check" class="screen" hidden>
    <h1 data-i18n="check_h"></h1>
    <p class="lead" data-i18n="check_lead"></p>
    <div class="card">
      <h2 data-i18n="vol_h"></h2>
      <p data-i18n="vol_text"></p>
      <button id="btn-vol" data-i18n="vol_play"></button>
    </div>
    <div class="card">
      <h2 data-i18n="lr_h"></h2>
      <p data-i18n="lr_text"></p>
      <p class="muted" id="lr-progress"></p>
      <div class="lr-row">
        <button id="btn-lr-play" data-i18n="lr_play"></button>
        <button id="btn-lr-left" disabled data-i18n="lr_left"></button>
        <button id="btn-lr-right" disabled data-i18n="lr_right"></button>
      </div>
      <p id="lr-result" hidden></p>
      <button id="btn-lr-retry" hidden data-i18n="lr_retry"></button>
    </div>
    <div class="actions"><button class="primary" id="btn-check" disabled data-i18n="check_continue"></button></div>
  </section>

  <!-- 4. instructions -->
  <section id="s-instr" class="screen" hidden>
    <h1 data-i18n="instr_h"></h1>
    <ol class="instr">
      <li data-i18n="instr_1"></li>
      <li data-i18n="instr_2"></li>
      <li data-i18n="instr_3"></li>
      <li data-i18n="instr_4"></li>
    </ol>
    <h2 data-i18n="instr_scale"></h2>
    <table class="scale" id="scale-table"></table>
    <div class="actions"><button class="primary" id="btn-instr" data-i18n="instr_start"></button></div>
  </section>

  <!-- 5. trials -->
  <section id="s-trial" class="screen" hidden>
    <h1 id="trial-title"></h1>
    <div class="player" id="player">
      <div class="transport">
        <button id="pl-play" class="round" disabled aria-label="Play/Pause">▶</button>
        <input id="pl-seek" type="range" min="0" max="1000" value="0" step="1" disabled aria-label="Position" />
        <span id="pl-time">0:00 / 0:00</span>
      </div>
      <div id="pl-sources" class="sources"></div>
      <p class="hint" id="pl-status"></p>
      <p class="hint" data-i18n="shared_hint"></p>
    </div>
    <h2 data-i18n="rate_h"></h2>
    <div id="ratings" class="ratings"></div>
    <p class="error" id="trial-error" hidden data-i18n="rate_all"></p>
    <div class="actions"><button class="primary" id="btn-next" disabled></button></div>
  </section>

  <!-- 6. final comment -->
  <section id="s-end" class="screen" hidden>
    <h1 data-i18n="end_h"></h1>
    <p class="lead" data-i18n="end_lead"></p>
    <textarea id="final-comment" rows="5" data-i18n-ph="end_comment_ph"></textarea>
    <div class="actions"><button class="primary" id="btn-submit" data-i18n="submit"></button></div>
  </section>

  <!-- 7. thanks -->
  <section id="s-thanks" class="screen" hidden>
    <h1 data-i18n="thanks_h"></h1>
    <p class="lead" id="thanks-text"></p>
    <p><button id="btn-download" data-i18n="download"></button></p>
    <p class="small"><span data-i18n="paper_text"></span> <a id="paper-link" target="_blank" rel="noopener" data-i18n="paper_link"></a></p>
  </section>
</main>

<footer class="foot">Gdańsk University of Technology · AES 2026</footer>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="player.js"></script>
<script src="app.js"></script>
</body>
</html>
